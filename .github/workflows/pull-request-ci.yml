name: Run tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  check-should-execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Update Registry
        id: update-registry
        uses: ./.github/actions/registry
        with:
          command: process-registry-updates
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: DEBUG

      - name: Validate Registry
        uses: ./.github/actions/registry
        with:
          command: validate
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: INFO

      - name: Commit changes
        if: steps.update-registry.outputs.failed == 'false' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.head_ref }}
          add_options: '--all'
          file_pattern: 'package_db/* registry/*'
