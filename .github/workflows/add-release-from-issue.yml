name: Process registration requests
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: register-release-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  register:
    uses: Chiv2-Community/zero-infra-mod-registry/.github/workflows/register-release.yml@v1
    with:
      tool_ref: v1
