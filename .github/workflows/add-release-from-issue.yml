name: Process mod repository actions
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  check-should-execute:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    outputs:
      should_execute: ${{ steps.check.outputs.should_execute }}
    steps:
      - name: Check if this should execute
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          shopt -s nocasematch
          SHOULD_EXECUTE=true

          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" != "retry" ]]; then
              SHOULD_EXECUTE=false
            fi
          fi

          echo "should_execute=$SHOULD_EXECUTE" >> $GITHUB_OUTPUT
          
  parse-json:
    runs-on: ubuntu-latest
    needs: check-should-execute
    if: needs.check-should-execute.outputs.should_execute == 'true'
    outputs:
      json_payload: ${{ steps.issue_json_payload.outputs.payload }}
      failed: ${{ steps.issue_json_payload.outputs.failed }}
      action: ${{ steps.validate_payload.outputs.action }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with: 
          ref: main
          
      - name: Parse Json in Issue
        id: issue_json_payload
        run:
          ./.github/workflows/scripts/extract-issue-json-body.sh "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post failure Results for JSON parsing
        uses: peter-evans/create-or-update-comment@v4
        if: steps.issue_json_payload.outputs.failed == 'true'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to parse the JSON in the issue body. Copy and paste the appropriate template below and add it to
            the issue description. Fill out the fields with the correct details. When complete, respond 
            to this issue thread with "retry"

            For adding a new package:
            ````
            ```
            {
              "action": "add-package",
              "repo_url": "https://github.com/Username/ExampleMod"
            }
            ```
            ````

            For adding a release to an existing package:
            ````
            ```
            {
              "action": "add-package-release",
              "repo_url": "https://github.com/Username/ExampleMod",
              "release_tag": "v0.0.1"
            }
            ```
            ````
            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.

      - name: Validate JSON payload
        id: validate_payload
        if: steps.issue_json_payload.outputs.failed == 'false'
        env:
          PAYLOAD: ${{ steps.issue_json_payload.outputs.payload }}
        run: |
          ACTION=$(jq -r '.action' <<< "$PAYLOAD")
          if [[ "$ACTION" == "add-dll-release" ]]; then
            if ! jq -e 'if has("dll_file") then (.dll_file | type == "string" and length > 0) else true end' <<< "$PAYLOAD" >/dev/null; then
              echo "dll_file must be a nonempty string when supplied" >> "$GITHUB_STEP_SUMMARY"
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          if [[ "$ACTION" != "add-package" && "$ACTION" != "add-package-release" && "$ACTION" != "add-dll-release" ]]; then
            echo "Invalid action: $ACTION. Must be 'add-package', 'add-package-release' or 'add-dll-release'" >> $GITHUB_STEP_SUMMARY
            echo "failed=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "action=$ACTION" >> $GITHUB_OUTPUT
          fi

      - name: Post failure Results for invalid action
        uses: peter-evans/create-or-update-comment@v4
        if: failure()
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to validate the JSON in the issue body. The `action` field must be `add-package`, `add-package-release` or `add-dll-release`. For DLL requests, `dll_file` must be a nonempty string when supplied.

            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.
             
  process-repository-action:
    runs-on: ubuntu-latest
    needs: parse-json
    if: needs.parse-json.outputs.failed == 'false'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Confirmation Message
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Successfully parsed issue body. Attempting to ${{ needs.parse-json.outputs.action }} to package DB."

      - name: Generate branch name
        id: branch-name
        run: |
          if [[ "${{ needs.parse-json.outputs.action }}" != "add-package-release" ]]; then
            BRANCH_NAME="issue-${{ github.event.issue.number }}-${{ needs.parse-json.outputs.action }}"
          else
            BRANCH_NAME="main"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Checkout main branch
        uses: actions/checkout@v4
        with: 
          ref: main
          
      - name: Create new branch for add-package
        if: needs.parse-json.outputs.action != 'add-package-release'
        run: |
          git checkout -b ${{ steps.branch-name.outputs.branch_name }}
          
      - name: Process repository action
        id: update-package-list
        uses: ./.github/actions/registry
        continue-on-error: true
        with:
          command: ${{ needs.parse-json.outputs.action }}
          repo_url: ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }}
          release_tag: ${{ needs.parse-json.outputs.action != 'add-package' && fromJson(needs.parse-json.outputs.json_payload).release_tag || '' }}
          dll_file: ${{ needs.parse-json.outputs.action == 'add-dll-release' && fromJson(needs.parse-json.outputs.json_payload).dll_file || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: INFO

      - name: Post failure Results 
        uses: peter-evans/create-or-update-comment@v4
        if: steps.update-package-list.outputs.failed == 'true'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to add release to package DB. Please check the logs below for more details.
            After addressing the errors, reply "retry"

            ```
            ${{ steps.update-package-list.outputs.result }}
            ```
            
            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.

      - name: Explain DLL asset selection after an ambiguous release
        uses: peter-evans/create-or-update-comment@v4
        if: >-
          steps.update-package-list.outputs.failed == 'true' &&
          needs.parse-json.outputs.action == 'add-dll-release' &&
          !fromJson(needs.parse-json.outputs.json_payload).dll_file &&
          contains(steps.update-package-list.outputs.result, 'A DLL release must contain exactly one DLL asset unless --dll-file selects one')
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            This release contains multiple DLL files. Choose the one you want to register.

            Edit the JSON in this issue's description to add a `dll_file` field containing the **exact, case-sensitive asset filename**, for example:

            ```json
            "dll_file": "UnchainedPlugin.dll"
            ```

            Add a comma after the preceding `release_tag` field so the JSON remains valid. Use the actual asset filename from your GitHub release, not necessarily the example above. Then reply **retry** on this issue.

            Only the chosen DLL will be downloaded and validated. No registry changes or pull request were created by this failed attempt.

      - name: Commit changes
        id: commit-registry
        if: steps.update-package-list.outputs.failed == 'false'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            ${{ needs.parse-json.outputs.action == 'add-package-release' && 'Add release' || 'Add package' }} for ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }}
            ${{ needs.parse-json.outputs.action == 'add-package-release' && format('Version: {0}', fromJson(needs.parse-json.outputs.json_payload).release_tag) || '' }}
            Issue: #${{ github.event.issue.number }}
          branch: ${{ steps.branch-name.outputs.branch_name }}
          add_options: '--all'
          file_pattern: 'package_db/* registry/* dll_db/*'

      # GITHUB_TOKEN pushes do not trigger the main push workflow.
      - name: Dispatch RC sync after a release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTION: ${{ needs.parse-json.outputs.action }}
          REGISTRY_FAILED: ${{ steps.update-package-list.outputs.failed }}
          COMMIT_OUTCOME: ${{ steps.commit-registry.outcome }}
          CHANGES_DETECTED: ${{ steps.commit-registry.outputs.changes_detected }}
          SOURCE_BRANCH: ${{ steps.branch-name.outputs.branch_name }}
          SOURCE_SHA: ${{ steps.commit-registry.outputs.commit_hash }}
        run: bash .github/workflows/scripts/dispatch-rc-registry-sync.sh
          
      - name: Create pull request
        if: steps.update-package-list.outputs.failed == 'false' && needs.parse-json.outputs.action != 'add-package-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }}
          REGISTRY_ACTION: ${{ needs.parse-json.outputs.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.branch-name.outputs.branch_name }}
        run: |
          REPO_NAME=$(echo "$REPO_URL" | sed -E 's|.*github.com/([^/]+/[^/]+).*|\1|' | sed 's|.git$||')
          PR_TITLE="$REGISTRY_ACTION: $REPO_NAME"
          PR_BODY="Registers release/package from $REPO_URL, Resolves #$ISSUE_NUMBER"
          
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME"
      
      - name: Post success results for add-package-release
        uses: peter-evans/create-or-update-comment@v4
        if: steps.update-package-list.outputs.failed == 'false' && needs.parse-json.outputs.action == 'add-package-release'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Successfully added release to package DB.
            ```
            ${{ steps.update-package-list.outputs.result }}
            ```
            
      - name: Post success results for add-package
        uses: peter-evans/create-or-update-comment@v4
        if: steps.update-package-list.outputs.failed == 'false' && needs.parse-json.outputs.action != 'add-package-release'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Successfully processed package addition and created a pull request.
            ```
            ${{ steps.update-package-list.outputs.result }}
            ```
            The PR will be linked to this issue and will close it automatically when merged.

      - name: Close Issue for release actions
        if: steps.update-package-list.outputs.failed == 'false' && needs.parse-json.outputs.action == 'add-package-release'
        run: gh issue close "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
