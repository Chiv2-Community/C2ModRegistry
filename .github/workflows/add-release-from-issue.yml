name: Process mod repository actions
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: register-release-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check-should-execute:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    outputs:
      should_execute: ${{ steps.check.outputs.should_execute }}
    steps:
      - name: Check if this should execute
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          shopt -s nocasematch
          SHOULD_EXECUTE=true

          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" != "retry" ]]; then
              SHOULD_EXECUTE=false
            fi
          fi

          echo "should_execute=$SHOULD_EXECUTE" >> "$GITHUB_OUTPUT"
          
  parse-json:
    runs-on: ubuntu-latest
    needs: check-should-execute
    if: needs.check-should-execute.outputs.should_execute == 'true'
    outputs:
      json_payload: ${{ steps.issue_json_payload.outputs.payload }}
      failed: ${{ steps.issue_json_payload.outputs.failed }}
      action: ${{ steps.validate_payload.outputs.action }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with: 
          ref: main
          
      - name: Parse Json in Issue
        id: issue_json_payload
        run:
          ./.github/workflows/scripts/extract-issue-json-body.sh "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post failure Results for JSON parsing
        uses: peter-evans/create-or-update-comment@v4
        if: steps.issue_json_payload.outputs.failed == 'true'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to parse the JSON in the issue body. Copy and paste the appropriate template below and add it to
            the issue description. Fill out the fields with the correct details. When complete, respond 
            to this issue thread with "retry"

            For adding a pak release (including a mod's first release):
            ````
            ```
            {
              "action": "add-package-release",
              "repo_url": "https://github.com/Username/ExampleMod",
              "release_tag": "v1.0.0"
            }
            ```
            ````

            For adding a DLL release:
            ````
            ```
            {
              "action": "add-dll-release",
              "repo_url": "https://github.com/Username/ExamplePlugin",
              "release_tag": "v1.0.0"
            }
            ```
            ````
            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.

      - name: Validate JSON payload
        id: validate_payload
        if: steps.issue_json_payload.outputs.failed == 'false'
        env:
          PAYLOAD: ${{ steps.issue_json_payload.outputs.payload }}
        run: |
          ACTION=$(jq -r '.action' <<< "$PAYLOAD")
          if ! jq -e 'type == "object" and (.repo_url | type == "string" and length > 0) and (.release_tag | type == "string" and length > 0)' <<< "$PAYLOAD" >/dev/null; then
            echo "repo_url and release_tag must be nonempty strings" >> "$GITHUB_STEP_SUMMARY"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "$ACTION" == "add-dll-release" ]]; then
            if ! jq -e 'if has("dll_file") then (.dll_file | type == "string" and length > 0) else true end' <<< "$PAYLOAD" >/dev/null; then
              echo "dll_file must be a nonempty string when supplied" >> "$GITHUB_STEP_SUMMARY"
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          if [[ "$ACTION" != "add-package-release" && "$ACTION" != "add-dll-release" ]]; then
            echo "Invalid action: $ACTION. Must be 'add-package-release' or 'add-dll-release'" >> "$GITHUB_STEP_SUMMARY"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          fi

      - name: Post failure Results for invalid action
        uses: peter-evans/create-or-update-comment@v4
        if: failure()
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to validate the JSON in the issue body. The `action` field must be `add-package-release` or `add-dll-release`. Both require nonempty `repo_url` and `release_tag` strings. For DLL requests, `dll_file` must be a nonempty string when supplied.

            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.
             
  process-repository-action:
    runs-on: ubuntu-latest
    needs: parse-json
    if: needs.parse-json.outputs.failed == 'false'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Confirmation Message
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Successfully parsed issue body. Attempting to ${{ needs.parse-json.outputs.action }} to ${{ needs.parse-json.outputs.action == 'add-dll-release' && 'DLL DB' || 'package DB' }}."

      - name: Checkout main branch
        uses: actions/checkout@v4
        with: 
          ref: main
          
      - name: Process repository action
        id: update-package-list
        uses: ./.github/actions/registry
        continue-on-error: true
        with:
          command: ${{ needs.parse-json.outputs.action }}
          repo_url: ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }}
          release_tag: ${{ fromJson(needs.parse-json.outputs.json_payload).release_tag }}
          dll_file: ${{ needs.parse-json.outputs.action == 'add-dll-release' && fromJson(needs.parse-json.outputs.json_payload).dll_file || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: INFO

      - name: Validate registry before creating a pull request
        id: validate-release
        if: steps.update-package-list.outputs.failed == 'false'
        uses: ./.github/actions/registry
        continue-on-error: true
        with:
          command: validate
          verify_dll_downloads: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: INFO

      - name: Report registry validation failure
        uses: peter-evans/create-or-update-comment@v4
        if: steps.validate-release.outputs.failed == 'true'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Registry validation failed. No registry commit or pull request will be created. Resolve the failure, then reply **retry**.

            ```
            ${{ steps.validate-release.outputs.result }}
            ```

      - name: Post failure Results 
        uses: peter-evans/create-or-update-comment@v4
        if: steps.update-package-list.outputs.failed == 'true'
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Failed to add release to ${{ needs.parse-json.outputs.action == 'add-dll-release' && 'DLL DB' || 'package DB' }}. Please check the logs below for more details.
            After addressing the errors, reply "retry"

            ```
            ${{ steps.update-package-list.outputs.result }}
            ```
            
            Check out the [Unchained Discord](https://discord.gg/chiv2unchained) for support.

      - name: Explain DLL asset selection after an ambiguous release
        uses: peter-evans/create-or-update-comment@v4
        if: >-
          steps.update-package-list.outputs.failed == 'true' &&
          needs.parse-json.outputs.action == 'add-dll-release' &&
          !fromJson(needs.parse-json.outputs.json_payload).dll_file &&
          contains(steps.update-package-list.outputs.result, 'A DLL release must contain exactly one DLL asset unless --dll-file selects one')
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            This release contains multiple DLL files. Choose the one you want to register.

            Edit the JSON in this issue's description to add a `dll_file` field containing the **exact, case-sensitive asset filename**, for example:

            ```json
            "dll_file": "UnchainedPlugin.dll"
            ```

            Add a comma after the preceding `release_tag` field so the JSON remains valid. Use the actual asset filename from your GitHub release, not necessarily the example above. Then reply **retry** on this issue.

            Only the chosen DLL will be downloaded and validated. No registry changes or pull request were created by this failed attempt.

      - name: Create pull request
        id: release-pr
        if: steps.update-package-list.outputs.failed == 'false' && steps.validate-release.outputs.failed == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: issue-${{ github.event.issue.number }}-${{ needs.parse-json.outputs.action }}
          add-paths: |
            package_db/
            registry/
            dll_db/
          commit-message: Register ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }} ${{ fromJson(needs.parse-json.outputs.json_payload).release_tag }}
          title: '${{ needs.parse-json.outputs.action }}: ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }} ${{ fromJson(needs.parse-json.outputs.json_payload).release_tag }}'
          body: |
            Register `${{ fromJson(needs.parse-json.outputs.json_payload).release_tag }}` from ${{ fromJson(needs.parse-json.outputs.json_payload).repo_url }}.

            Registry validation, including registered DLL download verification, passed. This release requires approval before merging.

            Resolves #${{ github.event.issue.number }}

      - name: Post success results
        uses: peter-evans/create-or-update-comment@v4
        if: steps.release-pr.outputs.pull-request-number != ''
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ${{ needs.parse-json.outputs.action == 'add-dll-release' && 'Created a pull request for approval to add this release to DLL DB.' || 'Created a pull request for approval to add this release to package DB.' }}
            ${{ steps.release-pr.outputs.pull-request-url }}
            ```
            ${{ steps.update-package-list.outputs.result }}
            ```
            The PR will be linked to this issue and will close it automatically when merged.
