name: Publish RC compatibility branch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable main commit (empty uses dispatch snapshot)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: sync-rc-registry
  cancel-in-progress: false
jobs:
  publish:
    uses: Chiv2-Community/zero-infra-mod-registry/.github/workflows/publish-registry.yml@v1.0.1
    with:
      tool_ref: v1.0.1
      target_branch: update-registry-format
      source_sha: ${{ inputs.source_sha || github.sha }}
