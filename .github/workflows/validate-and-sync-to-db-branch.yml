name: Publish database branch
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-db
  cancel-in-progress: false
jobs:
  publish:
    uses: Chiv2-Community/zero-infra-mod-registry/.github/workflows/publish-registry.yml@v1.0.1
    with:
      tool_ref: v1.0.1
      target_branch: db
