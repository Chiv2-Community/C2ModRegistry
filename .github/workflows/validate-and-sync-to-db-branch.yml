name: Update package list
on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [closed]
    branches:
      - main
jobs:
  merge-branch:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate Registry
        uses: Chiv2-Community/zero-infra-mod-registry@5577c4c3f5870f192c4929eaecc11ae6d7becf77 # prepare-v1
        with:
          command: validate
          github_token: ${{ secrets.GITHUB_TOKEN }}
          log_level: INFO


      - name: Merge main into db
        uses: everlytic/branch-merge@1.1.5
        with:
          github_token: ${{ github.token }}
          source_ref: ${{ github.ref }}
          target_branch: db
          commit_message_template: Merge main into db
